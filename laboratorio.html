<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de contraste · Idoia</title>
  <link rel="stylesheet" href="assets/css/ajustes.css?v=202610081138">
  <link rel="stylesheet" href="assets/css/base.css?v=202610081138">
  <style>
    body { min-height: 100vh; font: 14px/1.5 Arial, sans-serif; background: #111; }
    .fondo { position: fixed; inset: 0 320px 0 0; }
    .fondo img { width: 100%; height: 100%; object-fit: cover; }
    .muestra { position: fixed; inset: 0 320px 0 0; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 2rem; }
    .muestra h1 { font: 400 clamp(2rem, 5vw, 5rem)/1 Arial, sans-serif; -webkit-text-stroke: 0; }
    .muestra p { margin-top: 1.5rem; letter-spacing: .15em; font-size: .9rem; -webkit-text-stroke: 0; }
    .panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; overflow: auto; padding: 24px; background: #111; color: #fff; }
    .panel h2 { font-size: 1rem; font-weight: 400; margin-bottom: 1.2rem; }
    .panel label { display: block; margin: 1.5rem 0 .4rem; }
    .panel input[type=range] { display: block; width: 100%; }
    .panel button { display: block; margin: 1rem 0; padding: .5rem .8rem; border: 1px solid #777; }
    .panel p { color: #bbb; font-size: .82rem; margin: .8rem 0; }
    .muestra, .muestra * { color: #fff; }
    @media (max-width: 700px) {
      .fondo, .muestra { inset: 0 0 40vh 0; }
      .panel { top: 60vh; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="fondo"><img id="foto" alt="Foto de proyecto"></div>
  <div class="muestra"><div>
    <h1 data-dif>IDOIA ESTEBAN GALVÁN</h1>
    <p data-dif>PRODUCTION DESIGNER</p>
  </div></div>
  <aside class="panel">
    <h2>Contraste blanco y negro</h2>
    <p>La letra se vuelve negra sobre los tonos claros y blanca sobre los oscuros. No tiene contorno.</p>
    <label for="umbral">Umbral: <output id="valor">0.179</output></label>
    <input id="umbral" type="range" min="0.05" max="0.50" step="0.001" value="0.179">
    <p>Más alto: más zonas con letra blanca. Más bajo: más zonas con letra negra.</p>
    <button id="otraFoto" type="button">Ver otra foto →</button>
    <p>El valor publicado está en <code>assets/js/ajustes.js</code>.</p>
  </aside>
  <script src="contenido/datos-generados.js?v=202610081138"></script>
  <script>window.AJUSTES = { diferencia: { activo: true, umbral: 0.179, suavizado: 10, textos: "[data-dif]" } };</script>
  <script src="assets/js/contenido.js?v=202610081138"></script>
  <script src="assets/js/diferencia.js?v=202610081138"></script>
  <script>
    const fotos = [
      ...Web.proyectos("films"),
      ...Web.proyectos("series"),
      ...Web.proyectos("comercials"),
      ...Web.proyectos("videoclips"),
    ].map((p) => p.portada && p.portada.url).filter(Boolean);
    let n = 0;
    const foto = document.getElementById("foto");
    const mostrar = () => { foto.src = fotos[n % fotos.length] || ""; };
    document.getElementById("otraFoto").onclick = () => { n++; mostrar(); };
    const slider = document.getElementById("umbral"), valor = document.getElementById("valor");
    slider.oninput = () => { valor.textContent = Number(slider.value).toFixed(3); Diferencia.umbral(slider.value); };
    mostrar();
  </script>
</body>
</html>
