<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>About · Idoia Esteban Galván</title>
  <link rel="stylesheet" href="assets/css/ajustes.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/about.css">
</head>
<body data-pagina="about">

  <!-- ABOUT: bio, contacto, showreel y filmografía por orden cronológico.
       Textos: contenido/about/info.txt
       Trabajos que no tienen página propia: contenido/about/filmografia-extra.txt
       Lo monta assets/js/about.js -->
  <main class="about">
    <section class="bio">
      <figure class="bio__retrato" id="retrato"></figure>
      <div class="bio__texto">
        <p class="bio__sub" id="subtitulo"></p>
        <div class="bio__cuerpo" id="bio"></div>
        <ul class="contacto" id="contacto"></ul>
      </div>
    </section>

    <section class="showreel" id="showreel" hidden>
      <h2 class="seccion">Showreel</h2>
      <div class="showreel__marco"></div>
    </section>

    <section class="filmografia">
      <div class="filmografia__cabecera">
        <h2 class="seccion">Filmografía</h2>
        <div class="filtros" id="filtros">
          <button data-f="todo" class="activo">Todo</button>
          <button data-f="films">Films</button>
          <button data-f="comercials">Comercials</button>
        </div>
      </div>
      <ol class="filmografia__lista" id="filmografia"></ol>
    </section>
  </main>

  <script src="contenido/datos-generados.js"></script>
  <script src="assets/js/ajustes.js"></script>
  <script src="assets/js/contenido.js"></script>
  <script src="assets/js/comun.js"></script>
  <script src="assets/js/about.js"></script>
</body>
</html>
